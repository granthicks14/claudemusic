<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat Studio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Beat Studio</h1>
      <p class="subtitle">Pick a style, build a full arrangement, then produce it your way.</p>
    </header>

    <section id="style-select" class="style-grid"></section>

    <section id="workspace" class="workspace" hidden>
      <div class="transport">
        <button id="play-btn" class="transport-btn play">▶ Play</button>
        <button id="generate-btn" class="transport-btn">Generate Beat</button>
        <button id="shuffle-btn" class="transport-btn">Shuffle Sounds</button>

        <div id="bars-select" class="segmented">
          <button data-bars="4" class="selected">4 bars</button>
          <button data-bars="8">8 bars</button>
        </div>

        <div class="transport-field">
          <label for="key-select">Key</label>
          <select id="key-select"></select>
        </div>

        <div class="transport-field">
          <label for="tempo-slider">Tempo <span id="tempo-value"></span></label>
          <input type="range" id="tempo-slider">
        </div>

        <div class="transport-field">
          <label for="swing-slider">Swing <span id="swing-value"></span>%</label>
          <input type="range" id="swing-slider" min="0" max="30" value="10">
        </div>

        <button id="sidechain-btn" class="transport-btn toggle" title="Duck everything but drums when the kick hits">Sidechain</button>

        <div class="transport-field">
          <label for="master-slider">Master</label>
          <input type="range" id="master-slider" min="0" max="100" value="90">
        </div>
      </div>

      <p id="shuffle-status" class="shuffle-status"></p>

      <p class="hint">Click any cell to edit it directly. Click a track name to open its piano roll and place exact notes/chords. Each track's <strong>R</strong> knob controls its reverb send.</p>

      <div class="grid-wrap">
        <div id="section-row" class="section-row"></div>
        <div id="step-grid" class="step-grid"></div>
      </div>

      <div id="piano-roll" class="piano-roll" hidden>
        <div class="piano-roll-header">
          <span id="piano-roll-title"></span>
          <button id="piano-roll-close">Close ✕</button>
        </div>
        <div class="grid-wrap">
          <div id="piano-roll-grid" class="piano-roll-grid"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/theory.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
