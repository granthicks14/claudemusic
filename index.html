<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat Generator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1>Beat Generator</h1>
    <p class="subtitle">Pick a style, generate a beat, hit play.</p>

    <section id="style-select" class="style-grid"></section>

    <section class="controls" id="controls" hidden>
      <div class="control-row">
        <button id="generate-btn">Generate Beat</button>
        <button id="play-btn">Play</button>
        <div id="bars-select" class="bars-select">
          <button data-bars="4" class="selected">4 bars</button>
          <button data-bars="8">8 bars</button>
        </div>
      </div>
      <div class="control-row">
        <label for="tempo-slider">Tempo: <span id="tempo-value"></span> BPM</label>
        <input type="range" id="tempo-slider">
      </div>
      <div class="grid-wrap">
        <div id="section-row" class="section-row"></div>
        <div id="step-grid" class="step-grid"></div>
      </div>
    </section>
  </main>

  <script src="js/patterns.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
